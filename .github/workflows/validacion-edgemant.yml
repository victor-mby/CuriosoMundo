name: Validación EdgeMant

on:
  push:
    branches:
      - fix/validacion-inferencia
  pull_request:
    branches:
      - integracion/simulador-edgemant

jobs:
  pruebas-python:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxis Python
        run: python -m compileall -q base_datos dashboard integracion ml pruebas
      - name: Probar ingesta de telemetría
        run: python -m unittest discover -s integracion/pruebas -v
      - name: Probar importador CSV y migración
        run: python -m unittest discover -s base_datos/pruebas -v
      - name: Probar historial del dashboard
        run: python -m unittest discover -s dashboard/pruebas -v
      - name: Probar etapa 1
        run: python pruebas/probar_etapa1.py
      - name: Probar etapa 2 (entrenamiento e inferencia)
        run: python pruebas/probar_etapa2.py
      - name: Probar etapa 3 (dashboard y diagnóstico)
        run: python pruebas/probar_etapa3.py
